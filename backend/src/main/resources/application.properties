
spring.application.name=emergency-manager

# Port: local 8081, cloud hosting uses PORT
server.port=${PORT:8081}

# Database connection
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:emergency_manager}?sslMode=${DB_SSL_MODE:PREFERRED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Temporary resource reservation
allocation.hold-seconds=120
